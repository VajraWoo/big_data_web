# Matching mounts on all Spark nodes; existing resources and images stay unchanged.
x-silver-volumes: &silver-volumes
  - ../pipelines:/pipelines:ro
  - ../ml:/ml:ro
  - ../data/models:/models
  - ../data/silver:/data/silver
  - ../data/gold:/data/gold

services:
  spark-master:
    volumes: *silver-volumes
  spark-worker-1:
    volumes: *silver-volumes
  spark-worker-2:
    volumes: *silver-volumes
  spark-driver:
    volumes: *silver-volumes
