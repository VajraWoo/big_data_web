services:
  backend:
    profiles: [web]
    build:
      context: ../backend
    image: big-data-web-backend:0.1.0
    init: true
    networks: [web, database]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    volumes:
      - ../backend/app:/app/app:ro
      - ../backend/tests:/app/tests:ro
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    cpus: 1
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  frontend:
    profiles: [web]
    build:
      context: ../frontend
    image: big-data-web-frontend:0.1.0
    init: true
    networks: [web]
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ../frontend/src:/app/src:ro
    ports:
      - "127.0.0.1:5173:5173"
    mem_limit: 1g
    cpus: 1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
networks:
  web:
